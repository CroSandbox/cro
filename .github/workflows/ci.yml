name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
#  Shared environment
#  FORCE_LIBKRUN_STUB: compile the lightweight C stub instead of requiring
#  the real libkrun native library, which is not available in CI runners.
# ---------------------------------------------------------------------------
env:
  CARGO_TERM_COLOR: always
  FORCE_LIBKRUN_STUB: "1"
  RUST_BACKTRACE: "1"

jobs:
  # =========================================================================
  #  Formatting — fast gate, no deps needed beyond rustfmt
  # =========================================================================
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: krun-microvm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          # Disable the built-in Cargo cache; we don't compile here.
          cache: false

      - name: Check code formatting
        run: cargo fmt --all --check

  # =========================================================================
  #  Clippy — needs full deps (Go, protoc) to compile FFI crates
  # =========================================================================
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: krun-microvm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: krun-microvm/crates/libgvproxy-sys/gvproxy-bridge/go.sum

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  # =========================================================================
  #  Test Suite
  # =========================================================================
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    defaults:
      run:
        working-directory: krun-microvm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: krun-microvm/crates/libgvproxy-sys/gvproxy-bridge/go.sum

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Run test suite
        run: cargo test --workspace --verbose

  # =========================================================================
  #  Build Release Binaries
  # =========================================================================
  build-release:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    needs: [clippy, test]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: krun-microvm-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: krun-microvm-linux-amd64
    defaults:
      run:
        working-directory: krun-microvm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: krun-microvm/crates/libgvproxy-sys/gvproxy-bridge/go.sum

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package release bundle
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/microvm dist/
          cp target/${{ matrix.target }}/release/microvm-runner dist/
          cp target/${{ matrix.target }}/release/containerd-shim-krun-v2 dist/
          cp target/${{ matrix.target }}/release/krun-operator dist/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist .

      - name: Generate checksum
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            krun-microvm/${{ matrix.artifact_name }}.tar.gz
            krun-microvm/${{ matrix.artifact_name }}.tar.gz.sha256
          if-no-files-found: error
